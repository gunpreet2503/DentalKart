# Dentalkart Automation Configuration

# Application URL
app.url=https://www.dentalkart.com

# Search Configuration
search.min.results=5
search.max.load.time=3

# Selenium Configuration
selenium.wait.timeout=10
selenium.browser=chrome

# Test Data
test.keywords=implant,scaler,crown,bridge,implants

# Headless mode (set to true for CI/CD)
headless.mode=false

# Screenshot on failure
screenshot.on.failure=true
screenshot.path=test-output/screenshots/

# Report Configuration
report.path=test-output/reports/
